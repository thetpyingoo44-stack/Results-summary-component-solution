<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="card-container">
        <div class="card-left">
          <h2>Your Result</h2>
          <div class="content">
            <span class="number">76</span>
            <span class="number-1">of 100</span>
          </div>  
          <span class="txt">Great</span>
          <p>You scored higher than 65% of the people who have taken these tests.</p>
        </div>
        <div class="card-right">
          <h2>Summary</h2>
          <div class="right-content">
            <div>
              <img src="assets/images/icon-reaction.svg" alt="reaction icon">
              <span class="color-1">Reaction</span>
            </div>
            <div>
            <span>80 / 100</span>
            </div>
          </div>
          <div class="right-content">
            <div>
              <img src="assets/images/icon-memory.svg" alt="memory icon">
              <span class="color-2">Memory</span>
            </div>
            <div>
              <span>92 / 100</span>
            </div>
          </div>
          <div class="right-content">
            <div>
              <img src="assets/images/icon-verbal.svg" alt="verbal icon">
              <span class="color-3">Verbal</span>
            </div>
            <div>
            <span>61 / 100</span>
            </div>
          </div>
          <div class="right-content">
            <div>
              <img src="assets/images/icon-visual.svg" alt="visual icon">
              <span class="color-4">Visual</span>
            </div>
            <div>
            <span>73 / 100</span>
            </div>
          </div>
          <button type="submit" class="btn">Continue</button>

        </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">SaungThetPaingOo</a>.
  </footer>
</body>
</html>
